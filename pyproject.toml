[build-system]
#requires = ["setuptools>=45", "wheel"]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durdraw"
description = "Versatile ASCII and ANSI Art terminal text editor"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
version = "0.30.1"
classifiers = [
        'Environment :: Console :: Curses',
        'Topic :: Artistic Software',
        'Topic :: Text Editors',
        'Topic :: Terminals',
        'Intended Audience :: End Users/Desktop',
        'Natural Language :: English',
        'Operating System :: POSIX',
        'Operating System :: POSIX :: Linux',
        'Programming Language :: Python :: 3 :: Only',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14',
        'Programming Language :: Python :: 3.15',
        'Topic :: Utilities'
]
authors = [
  {name = "Sam Foster", email = "samfoster@gmail.com"},
  {name = "Durdraw Contributors"},
]
requires-python = ">=3.10"
dependencies = [
]

[project.urls]
Homepage = "https://durdraw.org"
Documentation = "https://github.com/durdraw/durdraw/blob/master/README.md"
Source = "https://github.com/durdraw/durdraw"
Changelog = "https://github.com/durdraw/durdraw/releases"


[project.optional-dependencies]
gif-export=["Pillow>=9.0.0"]

[project.scripts]
durdraw = "durdraw.main:main"
durfetch = "durdraw.durfetch:main"
durview = "durdraw.durview:main"

[tool.setuptools]
packages = ["durdraw"]

[tool.setuptools.package-data]
durdraw = [
    "help/*",
    "charsets/*",
    "themes/*",
    "plugins/*",
    "neofetch/*",
    "durf/*",
    "examples/*",
    "msdos/*",
]

